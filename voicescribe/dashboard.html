<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0d0d;
    --card: #161616;
    --card2: #1c1c1c;
    --border: #262626;
    --text: #f0f0f0;
    --muted: #7a7a7a;
    --accent: #ffffff;
    --danger: #a84040;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
  }
  body { height: 100vh; display: flex; flex-direction: column; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    padding: 26px 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 14px 12px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { color: #b0b0b0; }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  /* Page */
  .page {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px 26px;
  }
  .page::-webkit-scrollbar { width: 8px; }
  .page::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  /* Stats grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .num {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat .lbl {
    margin-top: 3px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .section h2 {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .input-row label { font-size: 12px; color: var(--muted); flex: 1; }
  input[type="number"], input[type="text"], textarea {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    width: 100%;
  }
  input[type="number"] { width: 70px; text-align: right; }
  input:focus, textarea:focus { border-color: #444; }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }

  .saved {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .saved .big { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .saved .faint { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .empty {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 26px 10px;
    line-height: 1.6;
  }

  /* History */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .hitem {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .hitem .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .hitem .text {
    font-size: 13px;
    color: #e0e0e0;
    line-height: 1.45;
    user-select: text;
    -webkit-user-select: text;
    word-break: break-word;
  }
  .hitem .actions { display: flex; gap: 6px; }
  .iconbtn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 11px;
    border-radius: 4px;
  }
  .iconbtn:hover { color: var(--text); background: #252525; }
  .iconbtn.danger:hover { color: #ff8080; }

  /* Dictionary & Snippets items */
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .item .k {
    font-size: 13px;
    color: #e8e8e8;
    user-select: text;
    -webkit-user-select: text;
  }
  .item .arrow { color: var(--muted); font-size: 12px; }
  .item .v {
    flex: 1;
    font-size: 12px;
    color: #b5b5b5;
    user-select: text;
    -webkit-user-select: text;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item.dict .k { flex: 1; }

  /* Add form */
  .add-form {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    background: #eeeeee;
    color: #0d0d0d;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-start;
  }
  .btn:hover { background: #ffffff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 10px;
  }

  /* AI polish */
  .ai-status {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ai-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #555;
  }
  .ai-dot.live {
    background: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18);
  }
  .ai-dot.idle { background: #6a6a6a; }
  .ai-dot.warn { background: #e6b800; }
  .ai-dot.offline { background: #6a3a3a; }
  .ai-text { flex: 1; min-width: 0; }
  .ai-title {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  .ai-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.4;
  }
  .ai-sub a { color: #c0c0c0; text-decoration: underline; }
  .ai-sub code {
    background: #0a0a0a;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 10px;
    color: #d8d8d8;
  }
  .ai-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .ai-row label {
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .ai-row select {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%237a7a7a' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
  }
  .ai-row select:focus { border-color: #444; }

  /* Developer mode accordion */
  .accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .accordion-header:hover .accordion-title { color: #fff; }
  .accordion-title {
    font-family: ui-serif, "New York", Georgia, serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.005em;
    transition: color 0.15s;
  }
  .accordion-icon {
    color: var(--muted);
    font-size: 14px;
    transition: transform 0.18s;
  }
  .accordion.open .accordion-icon { transform: rotate(180deg); color: var(--text); }
  .accordion-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.22s ease, padding 0.22s ease;
  }
  .accordion.open .accordion-body {
    max-height: 240px;
    padding: 4px 0 16px;
  }
  .accordion-body p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
    margin: 0 0 8px;
  }
  .accordion-body code {
    background: #0a0a0a;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: 11px;
    color: #d8d8d8;
  }

  /* Section title in serif (matches Wispr aesthetic) */
  .dev-headline {
    font-family: ui-serif, "New York", Georgia, serif;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: var(--text);
    margin: 0 0 6px;
  }
  .dev-sub {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  /* iOS-style toggle switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #333;
    transition: 0.18s;
    border-radius: 20px;
  }
  .slider::before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    top: 3px;
    background-color: #f0f0f0;
    transition: 0.18s;
    border-radius: 50%;
  }
  .switch input:checked + .slider { background-color: #4ade80; }
  .switch input:checked + .slider::before { transform: translateX(16px); }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tab="home">Home</div>
    <div class="tab" data-tab="hist">History</div>
    <div class="tab" data-tab="dict">Dictionary</div>
    <div class="tab" data-tab="snip">Snippets</div>
  </div>

  <div class="page" id="page"></div>

<script>
let STATE = null;
let ACTIVE = "home";

function fmtSecs(s) {
  s = Math.round(s);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return rs ? `${m}m ${rs}s` : `${m}m`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return rm ? `${h}h ${rm}m` : `${h}h`;
}
function fmtNum(n) { return (n || 0).toLocaleString(); }
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString([], {
    month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function send(type, payload = {}) {
  window.webkit.messageHandlers.vsbridge.postMessage({type, ...payload});
}

// ── HOME (stats + AI polish + time saved) ──────────────────────────────────
function renderHome(s) {
  const p = s.polish || { enabled: false, model: null, ollama_up: false, models: [] };

  let polishBlock;
  if (!p.ollama_up) {
    polishBlock = `
      <div class="ai-status">
        <div class="ai-dot offline"></div>
        <div class="ai-text">
          <div class="ai-title">Ollama not running</div>
          <div class="ai-sub">Install at <a href="https://ollama.com" target="_blank">ollama.com</a>, then run <code>ollama pull llama3.2:3b</code></div>
        </div>
      </div>`;
  } else if (p.models.length === 0) {
    polishBlock = `
      <div class="ai-status">
        <div class="ai-dot warn"></div>
        <div class="ai-text">
          <div class="ai-title">Ollama running — no models</div>
          <div class="ai-sub">Run <code>ollama pull llama3.2:3b</code> in your terminal.</div>
        </div>
      </div>`;
  } else {
    const opts = p.models.map(m =>
      `<option value="${escapeHtml(m)}" ${m === p.model ? "selected" : ""}>${escapeHtml(m)}</option>`
    ).join("");
    polishBlock = `
      <div class="ai-status">
        <div class="ai-dot ${p.enabled ? "live" : "idle"}"></div>
        <div class="ai-text">
          <div class="ai-title">Polish with local AI</div>
          <div class="ai-sub">Cleans fillers, fixes grammar, keeps your meaning.</div>
        </div>
        <label class="switch">
          <input id="polish-toggle" type="checkbox" ${p.enabled ? "checked" : ""}>
          <span class="slider"></span>
        </label>
      </div>
      <div class="ai-row">
        <label>Model</label>
        <select id="polish-model">${opts}</select>
      </div>`;
  }

  return `
    <div class="grid">
      <div class="stat"><div class="num">${fmtNum(s.total_words)}</div><div class="lbl">words</div></div>
      <div class="stat"><div class="num">${s.total_sessions}</div><div class="lbl">sessions</div></div>
      <div class="stat"><div class="num">${fmtSecs(s.total_secs)}</div><div class="lbl">recorded</div></div>
      <div class="stat"><div class="num">${s.avg_speak_wpm || 0}</div><div class="lbl">avg WPM</div></div>
    </div>

    <div class="section">
      <h2>AI Polish</h2>
      ${polishBlock}
    </div>

    <div class="section">
      <div class="dev-headline">Speaks your code's language.</div>
      <div class="dev-sub">When you talk like a developer, VoiceScribe writes like one. No flag to flip — it kicks in automatically the moment it hears a filename, hook, or command.</div>
      <div class="accordion" id="acc-files">
        <div class="accordion-header" data-acc="files">
          <span class="accordion-title">Filenames</span>
          <span class="accordion-icon">▾</span>
        </div>
        <div class="accordion-body">
          <p>Say "<em>app dot py</em>" — get <code>app.py</code>. Say "<em>tsconfig dot json</em>" — get <code>tsconfig.json</code>.</p>
          <p>Recognised extensions: <code>.py</code> <code>.js</code> <code>.ts</code> <code>.tsx</code> <code>.html</code> <code>.css</code> <code>.json</code> <code>.md</code> <code>.env</code> <code>.sh</code> <code>.go</code> <code>.rs</code> <code>.yaml</code></p>
        </div>
      </div>
      <div class="accordion" id="acc-syntax">
        <div class="accordion-header" data-acc="syntax">
          <span class="accordion-title">Identifiers &amp; commands</span>
          <span class="accordion-icon">▾</span>
        </div>
        <div class="accordion-body">
          <p>Hooks, methods, and shell commands keep their casing — <code>useState</code>, <code>setCount</code>, <code>git push origin main</code>, <code>kubectl apply</code>.</p>
          <p>Inline code is wrapped in backticks, so pastes into Markdown editors stay formatted.</p>
        </div>
      </div>
      <div class="accordion" id="acc-jargon">
        <div class="accordion-header" data-acc="jargon">
          <span class="accordion-title">Acronyms &amp; tools</span>
          <span class="accordion-icon">▾</span>
        </div>
        <div class="accordion-body">
          <p>Names and acronyms stay verbatim: <code>API</code>, <code>JSON</code>, <code>PostgreSQL</code>, <code>OAuth</code>, <code>Next.js</code>, <code>TypeScript</code>, <code>Vercel</code>, <code>Ollama</code>.</p>
          <p>Whisper itself is pre-biased with these terms, so they're transcribed correctly the first time — before polish even runs.</p>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Time saved</h2>
      <div class="input-row">
        <label>Your typing speed</label>
        <input id="typing-wpm" type="number" min="1" max="300" value="${s.typing_wpm}">
        <span style="font-size:12px;color:var(--muted)">WPM</span>
      </div>
      <div class="saved">
        <div class="big">${fmtSecs(s.saved_week_secs)}</div>
        <div class="faint">saved this week</div>
        <div class="faint" style="margin-top:8px">All-time: ${fmtSecs(s.saved_all_secs)}</div>
      </div>
    </div>
  `;
}

function bindHome() {
  const inp = document.getElementById("typing-wpm");
  if (inp) {
    let t;
    inp.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const val = parseInt(inp.value, 10);
        if (val >= 1 && val <= 300) send("setTypingWpm", {value: val});
      }, 250);
    });
  }
  const tog = document.getElementById("polish-toggle");
  if (tog) {
    tog.addEventListener("change", () => {
      const v = tog.checked;
      // Optimistic local update so the toggle stays in the user's chosen
      // state even if the Python round-trip's vsUpdate arrives stale.
      if (STATE && STATE.polish) STATE.polish.enabled = v;
      send("setPolish", {enabled: v});
    });
  }
  const sel = document.getElementById("polish-model");
  if (sel) {
    sel.addEventListener("change", () => {
      const v = sel.value;
      if (STATE && STATE.polish) STATE.polish.model = v;
      send("setPolish", {model: v});
    });
  }
  // Accordion expand/collapse — pure CSS state, no round-trip needed
  document.querySelectorAll(".accordion-header").forEach(h => {
    h.addEventListener("click", () => {
      h.parentElement.classList.toggle("open");
    });
  });
}

// ── HISTORY ─────────────────────────────────────────────────────────────────
function renderHist(s) {
  if (s.total_sessions === 0) {
    return `<div class="empty" style="padding:48px 10px">No sessions yet.<br>Double-tap Fn to record.</div>`;
  }
  const list = s.history.map(h => `
    <div class="hitem" data-id="${h.id}">
      <div class="meta">
        <span>${fmtTime(h.ts)} · ${h.words} words · ${fmtSecs(h.duration)}</span>
        <div class="actions">
          <button class="iconbtn" data-act="copy" data-id="${h.id}">Copy</button>
          <button class="iconbtn danger" data-act="del" data-id="${h.id}">Delete</button>
        </div>
      </div>
      <div class="text">${escapeHtml(h.text) || '<span style="color:var(--muted)">(no text)</span>'}</div>
    </div>
  `).join("");
  return `<div class="history-list">${list}</div>`;
}

function bindHist() {
  document.querySelectorAll(".hitem .iconbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id, 10);
      const act = btn.dataset.act;
      if (act === "del") send("deleteSession", {id});
      else if (act === "copy") {
        const h = STATE.history.find(x => x.id === id);
        if (h) navigator.clipboard.writeText(h.text || "");
      }
    });
  });
}

// ── DICTIONARY ──────────────────────────────────────────────────────────────
function renderDict(s) {
  const list = s.dictionary.length ? s.dictionary.map(w => `
    <div class="item dict">
      <div class="k">${escapeHtml(w)}</div>
      <button class="iconbtn danger" data-word="${escapeHtml(w)}">Remove</button>
    </div>
  `).join("") : `<div class="empty">No custom words yet.</div>`;

  return `
    <div class="hint">
      Words and names Whisper should recognise. Add proper nouns, company terms,
      or jargon here — they'll be biased into every transcription.
    </div>
    <div class="add-form">
      <input id="dict-input" type="text" placeholder="e.g. FigJam, Samir, Lyft">
      <button class="btn" id="dict-add">Add word</button>
    </div>
    ${list}
  `;
}

function bindDict() {
  const inp = document.getElementById("dict-input");
  const btn = document.getElementById("dict-add");
  const submit = () => {
    const v = inp.value.trim();
    if (v) { send("addWord", {word: v}); inp.value = ""; }
  };
  btn.addEventListener("click", submit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  inp.focus();
  document.querySelectorAll(".item.dict .iconbtn").forEach(b => {
    b.addEventListener("click", () => send("removeWord", {word: b.dataset.word}));
  });
}

// ── SNIPPETS ────────────────────────────────────────────────────────────────
function renderSnip(s) {
  const list = s.snippets.length ? s.snippets.map(sn => `
    <div class="item">
      <div class="k">"${escapeHtml(sn.trigger)}"</div>
      <span class="arrow">→</span>
      <div class="v" title="${escapeHtml(sn.expansion)}">${escapeHtml(sn.expansion)}</div>
      <button class="iconbtn danger" data-trigger="${escapeHtml(sn.trigger)}">Remove</button>
    </div>
  `).join("") : `<div class="empty">No snippets yet.</div>`;

  return `
    <div class="hint">
      Say the trigger phrase during a recording and it'll be replaced with the
      expansion on paste. Case-insensitive.
    </div>
    <div class="add-form">
      <input id="snip-trigger" type="text" placeholder="Trigger (e.g. intro email)">
      <textarea id="snip-expansion" placeholder="Expansion text…"></textarea>
      <button class="btn" id="snip-add">Add snippet</button>
    </div>
    ${list}
  `;
}

function bindSnip() {
  const trig = document.getElementById("snip-trigger");
  const exp = document.getElementById("snip-expansion");
  const btn = document.getElementById("snip-add");
  btn.addEventListener("click", () => {
    const t = trig.value.trim(), e = exp.value.trim();
    if (t && e) { send("addSnippet", {trigger: t, expansion: e}); trig.value = ""; exp.value = ""; trig.focus(); }
  });
  document.querySelectorAll(".item .iconbtn").forEach(b => {
    if (b.dataset.trigger) {
      b.addEventListener("click", () => send("removeSnippet", {trigger: b.dataset.trigger}));
    }
  });
}

// ── Tab switching ───────────────────────────────────────────────────────────
function render() {
  if (!STATE) return;
  const page = document.getElementById("page");
  if (ACTIVE === "home") { page.innerHTML = renderHome(STATE); bindHome(); }
  else if (ACTIVE === "hist") { page.innerHTML = renderHist(STATE); bindHist(); }
  else if (ACTIVE === "dict") { page.innerHTML = renderDict(STATE); bindDict(); }
  else if (ACTIVE === "snip") { page.innerHTML = renderSnip(STATE); bindSnip(); }
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    ACTIVE = t.dataset.tab;
    render();
  });
});

// Called by native when data changes.
window.vsUpdate = function(json) {
  try { STATE = JSON.parse(json); } catch (e) { return; }
  render();
};

// Ask for fresh data on boot + retry briefly in case the message handler
// wasn't fully wired yet when this script first ran.
send("refresh");
setTimeout(() => { if (!STATE) send("refresh"); }, 150);
setTimeout(() => { if (!STATE) send("refresh"); }, 500);
</script>
</body>
</html>
