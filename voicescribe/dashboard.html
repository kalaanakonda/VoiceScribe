<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0d0d;
    --card: #161616;
    --card2: #1c1c1c;
    --border: #262626;
    --text: #f0f0f0;
    --muted: #7a7a7a;
    --accent: #ffffff;
    --danger: #a84040;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 13px;
    user-select: none;
    -webkit-user-select: none;
  }
  body { height: 100vh; display: flex; flex-direction: column; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    padding: 26px 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 14px 12px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { color: #b0b0b0; }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  /* Page */
  .page {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px 26px;
  }
  .page::-webkit-scrollbar { width: 8px; }
  .page::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  /* Stats grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .num {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat .lbl {
    margin-top: 3px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .section h2 {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .input-row label { font-size: 12px; color: var(--muted); flex: 1; }
  input[type="number"], input[type="text"], textarea {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    width: 100%;
  }
  input[type="number"] { width: 70px; text-align: right; }
  input:focus, textarea:focus { border-color: #444; }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }

  .saved {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .saved .big { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .saved .faint { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .empty {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 26px 10px;
    line-height: 1.6;
  }

  /* History */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .hitem {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .hitem .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .hitem .text {
    font-size: 13px;
    color: #e0e0e0;
    line-height: 1.45;
    user-select: text;
    -webkit-user-select: text;
    word-break: break-word;
  }
  .hitem .actions { display: flex; gap: 6px; }
  .iconbtn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 11px;
    border-radius: 4px;
  }
  .iconbtn:hover { color: var(--text); background: #252525; }
  .iconbtn.danger:hover { color: #ff8080; }

  /* Dictionary & Snippets items */
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .item .k {
    font-size: 13px;
    color: #e8e8e8;
    user-select: text;
    -webkit-user-select: text;
  }
  .item .arrow { color: var(--muted); font-size: 12px; }
  .item .v {
    flex: 1;
    font-size: 12px;
    color: #b5b5b5;
    user-select: text;
    -webkit-user-select: text;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item.dict .k { flex: 1; }

  /* Add form */
  .add-form {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    background: #eeeeee;
    color: #0d0d0d;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-start;
  }
  .btn:hover { background: #ffffff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tab="home">Home</div>
    <div class="tab" data-tab="dict">Dictionary</div>
    <div class="tab" data-tab="snip">Snippets</div>
  </div>

  <div class="page" id="page"></div>

<script>
let STATE = null;
let ACTIVE = "home";

function fmtSecs(s) {
  s = Math.round(s);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return rs ? `${m}m ${rs}s` : `${m}m`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return rm ? `${h}h ${rm}m` : `${h}h`;
}
function fmtNum(n) { return (n || 0).toLocaleString(); }
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString([], {
    month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function send(type, payload = {}) {
  window.webkit.messageHandlers.vsbridge.postMessage({type, ...payload});
}

// ── HOME (stats + history) ──────────────────────────────────────────────────
function renderHome(s) {
  const empty = s.total_sessions === 0;
  const historyHtml = empty
    ? `<div class="empty" style="padding:18px 10px">No sessions yet. Double-tap Fn to record.</div>`
    : s.history.map(h => `
        <div class="hitem" data-id="${h.id}">
          <div class="meta">
            <span>${fmtTime(h.ts)} · ${h.words} words · ${fmtSecs(h.duration)}</span>
            <div class="actions">
              <button class="iconbtn" data-act="copy" data-id="${h.id}">Copy</button>
              <button class="iconbtn danger" data-act="del" data-id="${h.id}">Delete</button>
            </div>
          </div>
          <div class="text">${escapeHtml(h.text) || '<span style="color:var(--muted)">(no text)</span>'}</div>
        </div>
      `).join("");

  return `
    <div class="grid">
      <div class="stat"><div class="num">${fmtNum(s.total_words)}</div><div class="lbl">words</div></div>
      <div class="stat"><div class="num">${s.total_sessions}</div><div class="lbl">sessions</div></div>
      <div class="stat"><div class="num">${fmtSecs(s.total_secs)}</div><div class="lbl">recorded</div></div>
      <div class="stat"><div class="num">${s.avg_speak_wpm || 0}</div><div class="lbl">avg WPM</div></div>
    </div>

    <div class="section">
      <h2>Time saved</h2>
      <div class="input-row">
        <label>Your typing speed</label>
        <input id="typing-wpm" type="number" min="1" max="300" value="${s.typing_wpm}">
        <span style="font-size:12px;color:var(--muted)">WPM</span>
      </div>
      <div class="saved">
        <div class="big">${fmtSecs(s.saved_week_secs)}</div>
        <div class="faint">saved this week</div>
        <div class="faint" style="margin-top:8px">All-time: ${fmtSecs(s.saved_all_secs)}</div>
      </div>
    </div>

    <div class="section">
      <h2>History</h2>
      <div class="history-list">${historyHtml}</div>
    </div>
  `;
}

function bindHome() {
  const inp = document.getElementById("typing-wpm");
  if (inp) {
    let t;
    inp.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const val = parseInt(inp.value, 10);
        if (val >= 1 && val <= 300) send("setTypingWpm", {value: val});
      }, 250);
    });
  }
  document.querySelectorAll(".hitem .iconbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id, 10);
      const act = btn.dataset.act;
      if (act === "del") send("deleteSession", {id});
      else if (act === "copy") {
        const h = STATE.history.find(x => x.id === id);
        if (h) navigator.clipboard.writeText(h.text || "");
      }
    });
  });
}

// ── DICTIONARY ──────────────────────────────────────────────────────────────
function renderDict(s) {
  const list = s.dictionary.length ? s.dictionary.map(w => `
    <div class="item dict">
      <div class="k">${escapeHtml(w)}</div>
      <button class="iconbtn danger" data-word="${escapeHtml(w)}">Remove</button>
    </div>
  `).join("") : `<div class="empty">No custom words yet.</div>`;

  return `
    <div class="hint">
      Words and names Whisper should recognise. Add proper nouns, company terms,
      or jargon here — they'll be biased into every transcription.
    </div>
    <div class="add-form">
      <input id="dict-input" type="text" placeholder="e.g. FigJam, Samir, Lyft">
      <button class="btn" id="dict-add">Add word</button>
    </div>
    ${list}
  `;
}

function bindDict() {
  const inp = document.getElementById("dict-input");
  const btn = document.getElementById("dict-add");
  const submit = () => {
    const v = inp.value.trim();
    if (v) { send("addWord", {word: v}); inp.value = ""; }
  };
  btn.addEventListener("click", submit);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  inp.focus();
  document.querySelectorAll(".item.dict .iconbtn").forEach(b => {
    b.addEventListener("click", () => send("removeWord", {word: b.dataset.word}));
  });
}

// ── SNIPPETS ────────────────────────────────────────────────────────────────
function renderSnip(s) {
  const list = s.snippets.length ? s.snippets.map(sn => `
    <div class="item">
      <div class="k">"${escapeHtml(sn.trigger)}"</div>
      <span class="arrow">→</span>
      <div class="v" title="${escapeHtml(sn.expansion)}">${escapeHtml(sn.expansion)}</div>
      <button class="iconbtn danger" data-trigger="${escapeHtml(sn.trigger)}">Remove</button>
    </div>
  `).join("") : `<div class="empty">No snippets yet.</div>`;

  return `
    <div class="hint">
      Say the trigger phrase during a recording and it'll be replaced with the
      expansion on paste. Case-insensitive.
    </div>
    <div class="add-form">
      <input id="snip-trigger" type="text" placeholder="Trigger (e.g. intro email)">
      <textarea id="snip-expansion" placeholder="Expansion text…"></textarea>
      <button class="btn" id="snip-add">Add snippet</button>
    </div>
    ${list}
  `;
}

function bindSnip() {
  const trig = document.getElementById("snip-trigger");
  const exp = document.getElementById("snip-expansion");
  const btn = document.getElementById("snip-add");
  btn.addEventListener("click", () => {
    const t = trig.value.trim(), e = exp.value.trim();
    if (t && e) { send("addSnippet", {trigger: t, expansion: e}); trig.value = ""; exp.value = ""; trig.focus(); }
  });
  document.querySelectorAll(".item .iconbtn").forEach(b => {
    if (b.dataset.trigger) {
      b.addEventListener("click", () => send("removeSnippet", {trigger: b.dataset.trigger}));
    }
  });
}

// ── Tab switching ───────────────────────────────────────────────────────────
function render() {
  if (!STATE) return;
  const page = document.getElementById("page");
  if (ACTIVE === "home") { page.innerHTML = renderHome(STATE); bindHome(); }
  else if (ACTIVE === "dict") { page.innerHTML = renderDict(STATE); bindDict(); }
  else if (ACTIVE === "snip") { page.innerHTML = renderSnip(STATE); bindSnip(); }
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    ACTIVE = t.dataset.tab;
    render();
  });
});

// Called by native when data changes.
window.vsUpdate = function(json) {
  try { STATE = JSON.parse(json); } catch (e) { return; }
  render();
};

// Ask for fresh data on boot + retry briefly in case the message handler
// wasn't fully wired yet when this script first ran.
send("refresh");
setTimeout(() => { if (!STATE) send("refresh"); }, 150);
setTimeout(() => { if (!STATE) send("refresh"); }, 500);
</script>
</body>
</html>
